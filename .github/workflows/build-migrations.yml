name: Autotag and release

on:
  push:
    branches:
      - main
    paths:
      - 'db/*'
      - '.github/workflows/build-migrations.yml'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Container Login
        uses: docker/login-action@v4.6.0
        with:
          registry: containers.whickerx.info
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: DBMate Build
        run: make docker DOCKERFILE=db/Dockerfile CONTEXT=db/ REGISTRY=containers.whickerx.info APP_NAME=emhassmigrations
