version: '3'
services:
  emhass:
    container_name: emhass
    image: ghcr.io/davidusb-geek/emhass:v0.18.7
    volumes:
      - ./emhass_config/share:/share
      - ./emhass_config/data:/data
      - ./emhass_config/secrets_emhass.yaml:/app/secrets_emhass.yaml
      - /etc/localtime:/etc/localtime:ro
    environment:
      - "LOCAL_COST_FUN=profit" # Maximizes profit (exports - imports)
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/ || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - emprometheus
  promhass:
    container_name: promhass
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: integration
    command: [ "--emhass_url", "http://emhass:5000/action/", "--dir", "/data", "--dsn", "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" ]
    volumes:
      - ./emhass_config/share:/share
      - ./emhass_config/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - emprometheus
    depends_on:
      - emhass
      - dbmate
  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - emprometheus
  dbmate:
    image: amacneil/dbmate
    container_name: dbmate
    volumes:
      - ./db:/db
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    command:
      - up
    depends_on:
      - postgres
    networks:
      - emprometheus
networks:
  emprometheus:
    driver: bridge   # Specify driver options
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"