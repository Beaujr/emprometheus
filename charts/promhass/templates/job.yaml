apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "promhass.fullname" . }}-migrations
  labels:
    {{- include "promhass.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        "helm.sh/hook": pre-install,pre-upgrade
        "helm.sh/hook-weight": "-5"
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
      labels:
        app: dbmate
    spec:
      restartPolicy: Never
      containers:
        - name: dbmate
          image: "{{ .Values.dbmate_image.repository }}:{{ .Values.dbmate_image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          command: ["dbmate"]
          args: ["up"]
          env:
            - name: DATABASE_URL
              value: {{ .Values.postgres }}
