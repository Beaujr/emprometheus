<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            width: 380px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
            color: #444;
        }

        select,
        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            transition: border 0.2s, box-shadow 0.2s;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #4c8bf5;
            box-shadow: 0 0 0 3px rgba(76,139,245,0.15);
        }

        button {
            margin-top: 26px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4c8bf5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
        }

        button:hover {
            background: #3a74d8;
        }

        button:active {
            transform: translateY(1px);
        }

        .msg {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
        }

        .success {
            color: #1a9c41;
        }

        .error {
            color: #d64545;
        }
    </style>

</head>

<body>

<div class="card">
    <h2>Admin Settings</h2>

    <form id="settingsForm">

        <label>Battery First Grid Charge</label>
        <select name="batteryfirstgridcharge">
            <option value="Enabled" {{if eq .BatteryFirstGridCharge "Enabled"}}selected{{end}}>Enabled</option>
            <option value="Disabled" {{if eq .BatteryFirstGridCharge "Disabled"}}selected{{end}}>Disabled</option>
        </select>

        <label>Work Mode Priority</label>
        <select name="workmodepriority">
            <option value="Battery first" {{if eq .WorkModePriority "Battery first"}}selected{{end}}>Battery first</option>
            <option value="Grid first" {{if eq .WorkModePriority "Grid First"}}selected{{end}}>Grid first</option>
            <option value="Load first" {{if eq .WorkModePriority "Load first"}}selected{{end}}>Load first</option>
        </select>

        <label>SOC</label>
        <input type="number" name="soc" value="{{.SOC}}" required>

        <label>Password</label>
        <input type="password" name="password" value="" required>

        <button type="submit">Apply Settings</button>

    </form>

    <div id="message" class="msg"></div>

</div>

<script>
    document.getElementById("settingsForm").addEventListener("submit", async function(e) {

        e.preventDefault()

        const form = e.target
        const data = new FormData(form)

        const response = await fetch("/admin/process", {
            method: "POST",
            body: data
        })

        const result = await response.json()

        const msg = document.getElementById("message")

        msg.textContent = result.message
        msg.className = "msg " + (result.success ? "success" : "error")
    })
</script>

</body>
</html>
