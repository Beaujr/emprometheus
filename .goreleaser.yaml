# goreleaser v2
version: 2

project_name: emprometheus

before:
  hooks:
    - go mod tidy
    - go mod vendor
    - go test ./internal/...

builds:
  - id: emhass
    main: ./cmd/emhass/main.go
    binary: app
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
dockers:
  - image_templates:
      - "containers.whickerx.info/emhass:{{ .Version }}-amd64"
      - "containers.whickerx.info/emhass:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goos: linux
    goarch: amd64
    ids:
      - emhass

  - image_templates:
      - "containers.whickerx.info/emhass:{{ .Version }}-arm64"
      - "containers.whickerx.info/emhass:latest-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: arm64
    ids:
      - emhass
docker_manifests:
  - name_template: "containers.whickerx.info/emhass:latest"
    image_templates:
      - "containers.whickerx.info/emhass:latest-amd64"
      - "containers.whickerx.info/emhass:latest-arm64"
checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Runtime.Goos }}{{ .Runtime.Goarch }}"